name: Update site

# Re-analyzes every US company worth $2B+ and publishes the site to GitHub Pages.
on:
  schedule:
    - cron: '45 10 * * 2-6' # Tue-Sat 10:45 UTC, early morning in New York, once the previous session's prices are final
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['.keepalive', 'README.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the Technical tab's chart library (TradingView Lightweight Charts, Apache-2.0), served from this site
      - name: Install the chart library
        run: npm install --no-save --no-audit --no-fund lightweight-charts@5.2.1
      - name: Analyze companies and build the site
        run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # A tiny commit every ~6 weeks keeps the daily update running.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%d > .keepalive
            git add .keepalive
            git commit -m "Keep the daily update running"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
