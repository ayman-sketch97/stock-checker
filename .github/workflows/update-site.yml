name: Update site

# Re-analyzes every US company worth $2B+ and publishes the site to GitHub Pages.
#
# Deployment safety. The site is published only if every required check passed, on the exact commit being built:
#   formulas, page-tests, security  ->  build  ->  verify-site  ->  gate  ->  deploy  ->  verify-live
# * Any failed, skipped, cancelled or missing required job blocks the deploy (the gate job, tools/deploy-gate.mjs).
# * The Pages artifact is created only by verify-site, from the folder that passed tools/check-site.mjs.
# * A failed or blocked run never touches the live site: GitHub Pages replaces it only when a deployment succeeds.
# * Restore point. Before any deployment a verified copy of the version that is live now must exist (job restore-point:
#   found through the deploy log, every file hash and the claimed commit re-checked). If it cannot be verified, nothing
#   is deployed. After a deployment that checks out, the new live version becomes the next restore point (kept 45 days).
# * verify-live reads the live site and checks it serves this commit; if not, rollback puts back the verified restore point.
# * The deploy log (branch deploy-log, append-only) records every run: analysis commit, build, record files and hashes,
#   gate results, deployment, live check, rollback, and whether the night's advice was recorded, deployed, both or neither.
# * Runs on any branch other than main stop before deploy (a dry run) and never write to the permanent record or the log.
# The rules are tested in test/deploy-safety.test.mjs and test/workflow.test.py.
on:
  schedule:
    - cron: '15 3 * * 2-6' # Tue-Sat 03:15 UTC (11:15pm New York, 7:15am UAE), once the day's closing prices are published
    - cron: '45 10 * * 2-6' # Tue-Sat 10:45 UTC, a second pass in case the first ran early or late
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['.keepalive', 'README.md']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ required checks (no network needed)
  formulas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # a failing test stops the publish, so a broken calculation never reaches the site
      - name: Test the formulas
        run: node --test test/formulas.test.mjs
      - name: Test the deployment safety tools
        run: node --test test/deploy-safety.test.mjs
      - name: Test restore protection and the deploy log
        run: node --test test/restore-and-log.test.mjs
      - name: Test the Shariah ledger
        run: node --test test/shariah-ledger.test.mjs
      - name: Test the thesis and decision record
        run: node --test test/thesis.test.mjs

  page-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Run the page tests
        run: python test/page.test.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No credentials in any tracked file
        run: node tools/scan-repo.mjs
      - name: The workflow still enforces the deployment rules
        run: pip install pyyaml==6.0.2 && python test/workflow.test.py

  # ------------------------------------------------------------------ a verified way back, before anything is replaced
  restore-point:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      used_commit: ${{ steps.find.outputs.commit }}
      used_digest: ${{ steps.find.outputs.digest }}
      used_run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # read only: the deploy log names every restore point that was made, and is the second witness for each
      - name: Get the deploy log
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git clone -q --depth 1 --branch deploy-log "$URL" deploy-log
          node tools/deploy-log.mjs verify deploy-log
      - name: A verified restore point exists for the version that is live now
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/find-restore-point.mjs --ledger deploy-log --repo "${{ github.repository }}" --live-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" --out restore-found
      - uses: actions/upload-artifact@v4
        with:
          name: restore-point-verified
          path: ${{ steps.find.outputs.dir }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ build (analysis of every company)
  build:
    needs: [formulas, page-tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # the permanent record is pushed to its own branch (main runs only)
    outputs:
      record_state: ${{ steps.recstate.outputs.record_state }}
      record_before: ${{ steps.recstate.outputs.record_before }}
      record_after: ${{ steps.recstate.outputs.record_after }}
      record_files: ${{ steps.recstate.outputs.record_files }}
      built_at: ${{ steps.facts.outputs.built_at }}
      price_date: ${{ steps.facts.outputs.price_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the Technical tab's chart library (TradingView Lightweight Charts, Apache-2.0), served from this site
      - name: Install the chart library
        run: npm install --no-save --no-audit --no-fund lightweight-charts@5.2.1
      # the permanent record of every call (lib/records.js): an append-only branch, one file per day. If it exists but
      # cannot be read tonight, it is left out (never started again from nothing)
      - name: Get the permanent record
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set +e; git ls-remote --exit-code --heads "$URL" records > /dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then
            git clone -q --depth 1 --branch records "$URL" records || { rm -rf records; echo "::warning::Could not read the permanent record; it is not updated tonight."; }
          elif [ $rc -eq 2 ]; then
            git init -q -b records records && echo "The permanent record starts tonight."
          else
            echo "::warning::Could not reach the permanent record; it is not updated tonight."
          fi
      - name: Note where the permanent record stands before tonight
        id: recbefore
        run: echo "head=$( [ -d records/.git ] && git -C records rev-parse HEAD 2>/dev/null || echo none )" >> "$GITHUB_OUTPUT"
      - name: Analyze companies and build the site
        run: node tools/build-site.mjs
      # adds today's files and refuses to push if any existing file would change or disappear. The site is published
      # either way, and says so if tonight's record was not saved
      - name: Save today's record
        id: record
        # only the real run on main writes to the permanent record; a test run on another branch never does
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash tools/save-record.sh records
      # for the deploy log: was tonight's advice recorded, and which record files (with hashes) did this run add?
      - name: Note what happened to the permanent record
        id: recstate
        run: bash tools/record-state.sh records "${{ steps.recbefore.outputs.head }}" "${{ github.ref == 'refs/heads/main' }}" "${{ steps.record.outcome }}" | tee -a "$GITHUB_OUTPUT"
      - name: Note when the data was built
        id: facts
        run: |
          echo "built_at=$(jq -r '.builtAt // empty' site/data/health.json)" >> "$GITHUB_OUTPUT"
          echo "price_date=$(jq -r '.priceDate // empty' site/data/health.json)" >> "$GITHUB_OUTPUT"
      - name: Note that tonight's record was not saved
        if: steps.record.outcome == 'failure'
        run: |
          node -e "const fs=require('fs');const f='site/data/record-summary.json';if(fs.existsSync(f)){const s=JSON.parse(fs.readFileSync(f,'utf8'));s.saved=false;fs.writeFileSync(f,JSON.stringify(s))}"
          echo "::error::Tonight's permanent record was not saved; see the step above."
      # the built folder is handed on as it is; only verify-site may turn it into the Pages artifact
      - uses: actions/upload-artifact@v4
        with:
          name: site-built
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ security and data-integrity checks on the built site
  verify-site:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.check.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site-built
          path: site
      - name: Check the built site (credentials, required files, valid data, pinned library, this commit)
        id: check
        run: node tools/check-site.mjs site --commit "${{ github.sha }}"
      # reached only if the check passed: this is the folder that gets published
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # ------------------------------------------------------------------ the gate
  gate:
    needs: [formulas, page-tests, security, restore-point, build, verify-site]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every required check must have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED: formulas,page-tests,security,restore-point,build,verify-site
        run: node tools/deploy-gate.mjs
      - name: Say what happens next
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Gate passed for ${{ github.sha }}: deploying." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Gate passed for ${{ github.sha }} on ${{ github.ref_name }}: dry run, nothing is deployed from a branch other than main." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------------ deploy (main only, only after the gate)
  deploy:
    needs: gate
    if: ${{ needs.gate.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------ after the deploy: is the live site the commit we deployed?
  verify-live:
    needs: [deploy, verify-site]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      created_commit: ${{ steps.rp.outputs.commit }}
      created_digest: ${{ steps.rp.outputs.digest }}
      created_files: ${{ steps.rp.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The live site serves this commit
        run: node tools/verify-live.mjs "${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}" "${{ github.sha }}" --wait 360
      # verified live: keep exactly these bytes as the next restore point (45 days), and say so in the deploy log
      - uses: actions/download-artifact@v4
        with:
          name: site-built
          path: site
      - name: These are the bytes that were checked
        run: |
          node tools/check-site.mjs site --commit "${{ github.sha }}" | tee check.log
          grep -q "${{ needs.verify-site.outputs.digest }}" check.log
      - name: Make and verify the restore point of the version now live
        id: rp
        run: |
          node tools/restore-point.mjs create site restore --commit "${{ github.sha }}" --source "run ${{ github.run_id }}, verified live" --run "${{ github.run_id }}"
          node tools/restore-point.mjs verify restore --commit "${{ github.sha }}" --digest "${{ needs.verify-site.outputs.digest }}"
          echo "files=$(jq -r .files restore/manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: restore-point
          path: restore
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 45

  # ------------------------------------------------------------------ if the live site is not what was deployed, put back the verified restore point
  rollback:
    needs: [deploy, verify-live, restore-point]
    if: ${{ always() && needs.deploy.result == 'success' && needs.verify-live.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the restore point that the restore-point job verified before the deployment, checked again before it is used
      - uses: actions/download-artifact@v4
        with:
          name: restore-point-verified
          path: restore
      - name: The stored version is intact and is the commit and fingerprint verified before
        run: node tools/restore-point.mjs verify restore --commit "${{ needs.restore-point.outputs.used_commit }}" --digest "${{ needs.restore-point.outputs.used_digest }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: rollback-pages
          path: restore/site
      - id: redeploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rollback-pages
      - name: The live site is the restored version
        run: node tools/verify-live.mjs "${{ steps.redeploy.outputs.page_url }}" "${{ needs.restore-point.outputs.used_commit }}" --wait 360

  # ------------------------------------------------------------------ the permanent deployment log (append-only branch deploy-log)
  ledger:
    needs: [formulas, page-tests, security, restore-point, build, verify-site, gate, deploy, verify-live, rollback]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes to the deploy-log branch only, and only for runs on main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add this run to the deploy log
        env:
          LEDGER_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          PUSH: ${{ github.ref == 'refs/heads/main' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: bash tools/ledger-push.sh

  # ------------------------------------------------------------------ housekeeping, only after a verified deploy
  keepalive:
    needs: verify-live
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # A tiny commit every ~6 weeks keeps the daily update running.
      - name: Keep the daily schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%d > .keepalive
            git add .keepalive
            git commit -m "Keep the daily update running"
            git push || echo "::warning::Could not add the keep-alive commit; the next run tries again."
          fi
