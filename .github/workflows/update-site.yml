name: Update site

# Re-analyzes every US company worth $2B+ and publishes the site to GitHub Pages.
on:
  schedule:
    - cron: '15 3 * * 2-6' # Tue-Sat 03:15 UTC (11:15pm New York, 7:15am UAE), once the day's closing prices are published
    - cron: '45 10 * * 2-6' # Tue-Sat 10:45 UTC, a second pass in case the first ran early or late
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['.keepalive', 'README.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the Technical tab's chart library (TradingView Lightweight Charts, Apache-2.0), served from this site
      - name: Install the chart library
        run: npm install --no-save --no-audit --no-fund lightweight-charts@5.2.1
      # formula checks: a failing test stops the publish, so a broken calculation never reaches the site
      - name: Test the formulas
        run: node --test test/formulas.test.mjs
      # the permanent record of every call (lib/records.js): an append-only branch, one file per day. If it exists but
      # cannot be read tonight, it is left out (never started again from nothing)
      - name: Get the permanent record
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set +e; git ls-remote --exit-code --heads "$URL" records > /dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then
            git clone -q --depth 1 --branch records "$URL" records || { rm -rf records; echo "::warning::Could not read the permanent record; it is not updated tonight."; }
          elif [ $rc -eq 2 ]; then
            git init -q -b records records && echo "The permanent record starts tonight."
          else
            echo "::warning::Could not reach the permanent record; it is not updated tonight."
          fi
      - name: Analyze companies and build the site
        run: node tools/build-site.mjs
      # adds today's files and refuses to push if any existing file would change or disappear. The site is published
      # either way, and says so if tonight's record was not saved
      - name: Save today's record
        id: record
        continue-on-error: true
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash tools/save-record.sh records
      - name: Note that tonight's record was not saved
        if: steps.record.outcome == 'failure'
        run: |
          node -e "const fs=require('fs');const f='site/data/record-summary.json';if(fs.existsSync(f)){const s=JSON.parse(fs.readFileSync(f,'utf8'));s.saved=false;fs.writeFileSync(f,JSON.stringify(s))}"
          echo "::error::Tonight's permanent record was not saved; see the step above."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # A tiny commit every ~6 weeks keeps the daily update running.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%d > .keepalive
            git add .keepalive
            git commit -m "Keep the daily update running"
            git push
          fi

  page-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Run the page tests
        run: python test/page.test.py

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
